{% extends "base.html" %}
{% block title %}Sentinel &mdash; Log in{% endblock %}
{% block content %}
<div class="panel" style="max-width: 360px; margin: 60px auto 0;">
  <h2>Log in</h2>
  <form method="post">
    <label for="password">Dashboard password</label>
    <input type="password" id="password" name="password" autofocus>
    <div class="actions">
      <button type="submit">Log in</button>
    </div>
  </form>
</div>
{% endblock %}
