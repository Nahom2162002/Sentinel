<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Sentinel{% endblock %}</title>
  <style>
    :root {
      --bg: #0f1115;
      --panel: #171a21;
      --border: #2a2e37;
      --text: #e6e8eb;
      --muted: #8b909c;
      --accent: #5b8cff;
      --good: #2ecc71;
      --bad: #e74c3c;
      --warn: #f1c40f;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    header {
      padding: 24px 32px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header h1 { font-size: 1.25rem; margin: 0; }
    header h1 span { color: var(--muted); font-weight: normal; }
    main { max-width: 900px; margin: 0 auto; padding: 32px; }
    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 20px 24px;
      margin-bottom: 24px;
    }
    .panel h2 { margin-top: 0; font-size: 1rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
    label { display: block; font-size: 0.85rem; color: var(--muted); margin-top: 12px; margin-bottom: 4px; }
    input[type=text], input[type=url], input[type=password] {
      width: 100%;
      padding: 8px 10px;
      background: #0f1115;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 0.95rem;
    }
    button {
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 6px;
      padding: 9px 16px;
      font-size: 0.9rem;
      cursor: pointer;
    }
    button.secondary { background: transparent; border: 1px solid var(--border); color: var(--text); }
    button.danger { background: transparent; border: 1px solid var(--bad); color: var(--bad); }
    button:hover { opacity: 0.85; }
    form.inline { display: inline; }
    .actions { margin-top: 16px; display: flex; gap: 10px; }
    .target {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px 18px;
      margin-bottom: 14px;
    }
    .target-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
    .target-name { font-weight: 600; font-size: 1.02rem; }
    .target-url { color: var(--muted); font-size: 0.82rem; word-break: break-all; }
    .badge {
      display: inline-block;
      font-size: 0.75rem;
      padding: 2px 9px;
      border-radius: 999px;
      font-weight: 600;
      white-space: nowrap;
    }
    .badge.baseline { background: rgba(241,196,15,0.15); color: var(--warn); }
    .badge.unchanged { background: rgba(139,144,156,0.15); color: var(--muted); }
    .badge.changed { background: rgba(46,204,113,0.15); color: var(--good); }
    .badge.error { background: rgba(231,76,60,0.15); color: var(--bad); }
    .badge.never { background: rgba(139,144,156,0.1); color: var(--muted); }
    .diff-preview {
      margin-top: 10px;
      background: #0f1115;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px 12px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.8rem;
      white-space: pre-wrap;
      color: var(--text);
      max-height: 160px;
      overflow-y: auto;
    }
    .meta-row { margin-top: 8px; font-size: 0.8rem; color: var(--muted); }
    .target-actions { display: flex; gap: 8px; margin-top: 12px; }
    .flash { background: rgba(91,140,255,0.12); border: 1px solid var(--accent); color: var(--text); padding: 10px 14px; border-radius: 6px; margin-bottom: 16px; font-size: 0.9rem; }
    .empty { color: var(--muted); font-size: 0.9rem; }
    .hint { color: var(--muted); font-size: 0.78rem; margin-top: 4px; }
  </style>
</head>
<body>
  <header>
    <h1>Sentinel <span>&mdash; change watcher</span></h1>
    {% block header_actions %}{% endblock %}
  </header>
  <main>
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        {% for message in messages %}
          <div class="flash">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
