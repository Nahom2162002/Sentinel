<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Sentinel{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0A0B0D;
      --bg-header: #0C0D10;
      --bg-panel-2: #0E0F12;
      --bg-panel: #101215;
      --border: #1C1F24;
      --border-row: #17191D;
      --border-input: #23272E;
      --border-hover: #3A4149;
      --border-2: #2A2F36;
      --text: #E8EAED;
      --muted-1: #8A9099;
      --muted-2: #7E858E;
      --muted-3: #6C737C;
      --muted-4: #5A6169;
      --dim: #3A4149;
      --accent: #4B93F7;
      --accent-hover: #6BA6F9;
      --accent-ink: #06131F;
      --good: #5FD08A;
      --warn: #E8C15F;
      --bad: #E9836F;
      --bad-border: #5E2E36;
      --bad-border-dim: #43242A;
      --bad-bg: #1B1113;
      --bad-bg-dim: #120E10;
      --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Archivo, Helvetica, sans-serif;
      -webkit-font-smoothing: antialiased;
      line-height: 1.5;
    }
    a { color: var(--text); }
    a:hover { color: #fff; }
    input, button, select { font-family: inherit; }
    input:focus { outline: none; }
    ::placeholder { color: var(--muted-4); }
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-thumb { background: var(--border-input); border-radius: 8px; }
    @keyframes pulse { 0%, 100% { opacity: 1 } 50% { opacity: .35 } }

    .mono { font-family: var(--mono); }
    .label { font-family: var(--mono); font-size: 10.5px; letter-spacing: .14em; color: var(--muted-2); }

    input[type=text], input[type=url], input[type=password] {
      background: var(--bg-header);
      border: 1px solid var(--border-input);
      border-radius: 9px;
      padding: 11px 13px;
      color: var(--text);
      font-size: 13.5px;
    }
    input[type=text]:focus, input[type=url]:focus, input[type=password]:focus { border-color: var(--accent); }

    button { cursor: pointer; }
    .btn { background: var(--accent); border: none; border-radius: 9px; padding: 10px 18px; color: var(--accent-ink); font-size: 13.5px; font-weight: 600; }
    .btn:hover { background: var(--accent-hover); }
    .btn-ghost { background: transparent; border: 1px solid var(--border-2); border-radius: 9px; padding: 10px 16px; color: var(--text); font-size: 13.5px; font-weight: 500; }
    .btn-ghost:hover { border-color: var(--border-hover); background: var(--bg-header); }
    .btn-danger { background: transparent; border: 1px solid var(--bad-border-dim); border-radius: 9px; padding: 10px 16px; color: var(--bad); font-size: 13.5px; font-weight: 500; }
    .btn-danger:hover { background: var(--bad-bg); border-color: var(--bad-border); }
    form.inline { display: inline; }

    .pill { font-family: var(--mono); font-size: 10.5px; letter-spacing: .08em; padding: 4px 9px; border-radius: 6px; white-space: nowrap; }
    .pill.changed { background: rgba(95,208,138,.12); color: var(--good); }
    .pill.unchanged { background: rgba(138,144,153,.12); color: var(--muted-1); }
    .pill.baseline { background: rgba(232,193,95,.13); color: var(--warn); }
    .pill.error { background: rgba(233,131,111,.13); color: var(--bad); }
    .pill.never { background: rgba(108,115,124,.1); color: var(--muted-3); }

    .dot { width: 8px; height: 8px; border-radius: 99px; flex: none; display: inline-block; }
    .dot.changed { background: var(--good); }
    .dot.unchanged { background: var(--muted-1); }
    .dot.baseline { background: var(--warn); }
    .dot.error { background: var(--bad); }
    .dot.never { background: var(--dim); }

    .flash { background: rgba(75,147,247,.1); border: 1px solid var(--accent); color: var(--text); padding: 10px 14px; border-radius: 9px; margin-bottom: 16px; font-size: 13px; }
    .hint { color: var(--muted-3); font-size: 12.5px; }
    .empty { color: var(--muted-1); font-size: 13.5px; }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
{% block body %}{% endblock %}
</body>
</html>
