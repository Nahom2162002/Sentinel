name: Automated Sentinel check

# Vercel's Hobby plan only allows cron jobs to fire once a day, which is too
# slow for real-time job alerts. This workflow hits the same /api/cron-check
# endpoint (see vercel.json's daily cron, kept as a fallback) every 5
# minutes instead, so Discord notifications go out automatically without
# anyone clicking "Check now".

"on":
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger check on deployed Sentinel app
        run: |
          http_status=$(curl -sS -o response.txt -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://sentinel-orpin-tau.vercel.app/api/cron-check")
          echo "Response body: $(cat response.txt)"
          if [ "$http_status" -ge 300 ]; then
            echo "Check request failed with HTTP $http_status"
            exit 1
          fi
