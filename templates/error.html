{% extends "base.html" %}
{% block title %}Sentinel &mdash; Setup needed{% endblock %}
{% block body %}
<div style="min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px">
  <div style="width:100%; max-width:560px; border:1px solid var(--border); border-radius:14px; background:var(--bg-panel); padding:26px 28px">
    <h2 style="margin:0 0 16px; font-size:19px; font-weight:600">Something needs configuring</h2>
    <div class="mono" style="background:var(--bg-header); border:1px solid var(--border); border-radius:9px; padding:14px 16px; font-size:12.5px; white-space:pre-wrap; color:var(--text)">{{ message }}</div>
    <p class="hint" style="margin-top:16px">See the "Web dashboard (app.py) — deploy to Vercel" section of the README for the full setup steps (provisioning Redis, setting env vars).</p>
  </div>
</div>
{% endblock %}
